[project]
name = "elotmm"
version = "1.0.0"
description = "Split players into two evenly matched teams by Elo rating"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elotmm"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004"]
"src/elotmm/example.py" = ["T201"]
